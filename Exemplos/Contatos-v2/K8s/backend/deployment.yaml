apiVersion: apps/v1
kind: Deployment
metadata:
  name: contatos-backend
  labels:
    app: contatos-backend
spec:
  selector:
    matchLabels:
      app: contatos-backend
  template:
    metadata:
      labels:
        app: contatos-backend
    spec:
      containers:
        - name: contatos-backend
          image: devopsufscar/contatos-v2-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: CORS
              value: "*"
            - name: MONGO_INITDB_HOST
              value: contatos-db
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: contatos-db-secret
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: contatos-db-secret
                  key: password
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
