services:
  frontend:
    image: devopsufscar/contatos-v2-frontend
    restart: always
    environment:
      API_URL: http://backend:5000
    ports:
      - "80:80"
    networks: 
      - frontend
    depends_on:
      backend:
        condition: service_started
  
  backend:
    image: devopsufscar/contatos-v2-backend
    restart: always
    networks:
      - backend
      - frontend
    env_file:
      - .env
    depends_on:
      - mongodb
      
  mongodb:
    image: mongo:4.2
    networks:
      - backend
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db
  
networks: 
  frontend:
  backend:
volumes:
  mongo-data:
