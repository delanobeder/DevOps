apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.global.db.name }}
  labels:
    run: {{ .Release.Name }}-{{ .Values.global.db.name }}
spec:
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app: {{ .Release.Name }}-{{ .Values.global.db.name }}
